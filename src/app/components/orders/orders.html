@if (loading) {
  <div class="loading-screen" role="status">
    <div class="spinner"></div>
    <span>טוען הזמנות...</span>
  </div>
} @else if (error) {
  <div class="alert-banner" dir="rtl">
    {{ error }}
    <button class="retry-btn" (click)="load()">נסה שוב</button>
  </div>
} @else {
  <app-orders-display />
}
